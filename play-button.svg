<svg width="380" height="76" viewBox="0 0 380 76" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Play Flappy Bird">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8FD8E0">
        <animate attributeName="stop-color" values="#8FD8E0;#70C5CE;#8FD8E0" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#74BF2E">
        <animate attributeName="stop-color" values="#74BF2E;#5DA324;#74BF2E" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <clipPath id="btnClip">
      <rect x="3" y="3" width="374" height="70" rx="20"/>
    </clipPath>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1b1b1b" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- pulsing glow ring -->
  <rect x="1" y="1" width="378" height="74" rx="21" fill="none" stroke="#FFE44D" stroke-width="2" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="1.5;5;1.5" dur="1.8s" repeatCount="indefinite"/>
  </rect>

  <!-- button body -->
  <g filter="url(#softShadow)">
    <rect x="3" y="3" width="374" height="70" rx="20" fill="url(#skyGrad)" stroke="#4C8A17" stroke-width="2"/>
  </g>

  <!-- shimmer sweep -->
  <g clip-path="url(#btnClip)">
    <rect x="-90" y="0" width="70" height="76" fill="#ffffff" opacity="0.32" transform="skewX(-18)">
      <animateTransform attributeName="transform" type="translate" values="-90 0;470 0" dur="2.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- bird -->
  <g transform="translate(44,38)">
    <animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 -7;0 0" dur="0.6s" repeatCount="indefinite"/>
    <ellipse cx="0" cy="0" rx="15" ry="12" fill="#FFD23F" stroke="#2b2b2b" stroke-width="1.6"/>
    <g transform="translate(-5,2)">
      <ellipse cx="0" cy="0" rx="9" ry="5.5" fill="#FFB800" stroke="#2b2b2b" stroke-width="1.3">
        <animateTransform attributeName="transform" type="rotate" values="0 0 0;-32 0 0;0 0 0;18 0 0;0 0 0" keyTimes="0;0.25;0.5;0.75;1" dur="0.6s" repeatCount="indefinite"/>
      </ellipse>
    </g>
    <circle cx="6" cy="-4" r="2.6" fill="#ffffff"/>
    <circle cx="7" cy="-4" r="1.2" fill="#111111"/>
    <path d="M13,1 L22,3.5 L13,7 Z" fill="#FF7A00" stroke="#2b2b2b" stroke-width="1"/>
  </g>

  <!-- label -->
  <g transform="translate(0,0)">
    <animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 -2;0 0" dur="0.6s" repeatCount="indefinite"/>
    <text x="223" y="36" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">PLAY NOW</text>
    <text x="223" y="56" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">FLAPPY BIRD</text>
  </g>
</svg>
